<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http//www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout-pre}">
	
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
	<!--CSS読み込み-->
	<link rel="stylesheet" th:href="@{/css/tmapp.css}">
	<title>ログイン</title>
</head>
<body>
	<div layout:fragment="content-pre" class="form-login">
		<form method="post" th:action="@{/login}">
			<h6 class="text-center font-weight-bold mt-5 mb-5">ログイン</h6>
			<!--ログインエラーメッセージ-->
			<p th:if="${session['SPRING_SECURITY_LAST_EXCEPTION']} != null"
				th:text="${session['SPRING_SECURITY_LAST_EXCEPTION'].message}"
				 class="text-danger"></p>
			<!--メールアドレス-->
			<div class="mb-3">
				<label for="email" th:text="#{email}"></label>
				<input id="email" type="text" class="form-control" name="email">
			</div>
			<!--パスワード-->
			<div class="mb-3">
				<label for="password" th:text="#{password}"></label>
				<input id="password" type="password" class="form-control" name="password">
			</div>
			<!--ログインボタン-->
			<input type="submit" value="ログイン" class="btn btn-outline-dark w-100 mt-3 mb-3">
			<!--新規登録へのリンク-->
			<div class="text-center"><a th:href="@{/signup}" >新規登録はコチラ</a></div>
		</form>
	</div>
	
	<!-- BootStrap -->
	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js" integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous"></script>
</body>
</html>
